AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Master template điều phối 3 nested stacks theo thứ tự:
  Network (01-vpc-network.yaml) -> Security (02-security-groups.yaml) -> EC2 (03-ec2-instances.yaml).
  3 template con phải được upload lên S3 trước khi deploy.

Parameters:
  # --- Nơi chứa 3 template con ---
  TemplatesBucketName:
    Type: String
    Description: Tên S3 bucket cùng region chứa upload 3 template con
  TemplatesPrefix:
    Type: String
    Default: cfn
    Description: Thư mục (prefix) trong bucket chứa 3 template con

  # --- Network ---
  ProjectName:
    Type: String
    Default: my-project
    Description: Tiền tố đặt tên cho các resource
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
  AvailabilityZone:
    Type: String
    Default: ""
    Description: AZ cho 2 subnet. Để trống sẽ dùng AZ đầu tiên của region

  # --- Security ---
  MyIp:
    Type: String
    Description: IP public của bạn theo dạng CIDR
  # --- EC2 ---
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Tên SSH Key Pair 
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Loại instance. processor

Resources:
  # ---------------------------------------------------------------------------
  # 1. Network: VPC, Subnets, IGW, NAT, Route Tables
  # ---------------------------------------------------------------------------
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}/vpc-network.yaml"
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
        AvailabilityZone: !Ref AvailabilityZone

  # ---------------------------------------------------------------------------
  # 2. Security: Public SG + Private SG (ImportValue VpcId từ NetworkStack)
  #    !Ref NetworkStack trả về Stack ID (ARN) dạng .../stack/<TÊN>/<GUID>,
  #    Split theo "/" rồi lấy phần tử [1] để ra tên thật của nested stack.
  # ---------------------------------------------------------------------------
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}/security-groups.yaml"
      Parameters:
        NetworkStackName: !Select [1, !Split ["/", !Ref NetworkStack]]
        MyIp: !Ref MyIp

  # ---------------------------------------------------------------------------
  # 3. EC2: Bastion + Private App (ImportValue Subnet IDs và SG IDs)
  # ---------------------------------------------------------------------------
  Ec2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplatesPrefix}/ec2-instances.yaml"
      Parameters:
        NetworkStackName: !Select [1, !Split ["/", !Ref NetworkStack]]
        SecurityStackName: !Select [1, !Split ["/", !Ref SecurityStack]]
        KeyName: !Ref KeyName
        InstanceType: !Ref InstanceType

Outputs:
  VpcId:
    Description: ID của VPC
    Value: !GetAtt NetworkStack.Outputs.VpcId

  NatPublicIP:
    Description: Public IP (Elastic IP) của NAT Gateway
    Value: !GetAtt NetworkStack.Outputs.NatPublicIP

  PublicEC2IP:
    Description: Public IP của Bastion Host
    Value: !GetAtt Ec2Stack.Outputs.PublicEC2IP

  PrivateEC2InternalIP:
    Description: Private IP của Private EC2
    Value: !GetAtt Ec2Stack.Outputs.PrivateEC2InternalIP