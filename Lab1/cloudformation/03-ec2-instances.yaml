AWSTemplateFormatVersion: "2010-09-09"
Description: "Template tao 2 EC2 Instances: Private va Public"

Parameters:
  NetworkStackName:
    Type: String
    Default: my-vpc
    Description: Ten stack 1 (01-vpc-network.yaml) 
  SecurityStackName:
    Type: String
    Default: my-sg
    Description: Ten stack 2 (02-security-groups.yaml)
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Ten SSH Key Pair 
  InstanceType:
    Type: String
    Default: t3.micro
    Description: Loai instance, processor
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AMI Amazon Linux 2023 moi nhat 

Resources:
  # ---------------------------------------------------------------------------
  # Public EC2 (Bastion Host): Public Subnet + Public SG + Public IP
  # ---------------------------------------------------------------------------
  PublicEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0" # Network interface dau 
          AssociatePublicIpAddress: true
          SubnetId:
            Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetId"
          GroupSet:
            - Fn::ImportValue: !Sub "${SecurityStackName}-PublicSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bastion"

  # ---------------------------------------------------------------------------
  # Private EC2 (App): Private Subnet + Private SG
  # ---------------------------------------------------------------------------
  PrivateEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0"
          AssociatePublicIpAddress: false
          SubnetId:
            Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetId"
          GroupSet:
            - Fn::ImportValue: !Sub "${SecurityStackName}-PrivateSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-app"

Outputs:
  PublicEC2IP:
    Description: Public IP cua Bastion Host
    Value: !GetAtt PublicEC2.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-PublicEC2IP"

  PrivateEC2InternalIP:
    Description: Private IP cua Private EC2
    Value: !GetAtt PrivateEC2.PrivateIp
    Export:
      Name: !Sub "${AWS::StackName}-PrivateEC2InternalIP"