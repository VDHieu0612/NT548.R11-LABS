# SonarQube Project Configuration
sonar.projectKey=nt548-microservice
sonar.projectName=NT548 DevOps Microservice
sonar.projectVersion=1.0.0

# Path den ma nguon va unit test
sonar.sources=app/src
sonar.tests=app/test

# Dinh dang ma hoa
sonar.sourceEncoding=UTF-8

# Bao cao do bao phu ma nguon (LCOV tu Jest)
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info

# server.js chi khoi dong HTTP server (da loai khoi coverage trong cau hinh Jest)
sonar.coverage.exclusions=app/src/server.js

# Bo qua node_modules va coverage report
sonar.exclusions=**/node_modules/**,**/coverage/**
