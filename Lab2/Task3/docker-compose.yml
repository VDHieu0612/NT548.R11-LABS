networks:
  cicd-net:
    driver: bridge
    name: cicd-net

volumes:
  jenkins_data:
    name: jenkins_data
  postgresql_data:
    name: postgresql_data
  sonarqube_data:
    name: sonarqube_data
  sonarqube_extensions:
    name: sonarqube_extensions
  sonarqube_logs:
    name: sonarqube_logs

services:
  # =========================================================================
  # 1. Jenkins Automation Server (Tu dong build kem Docker CLI)
  # =========================================================================
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-custom:lts-jdk17
    container_name: jenkins-server
    restart: unless-stopped
    user: root # Quyen root de goi docker socket build image tren host
    ports:
      - "8080:8080"   # Jenkins Web UI
      - "50000:50000" # Jenkins inbound agent port
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - jenkins_data:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock # Mount Docker socket
    networks:
      - cicd-net

  # =========================================================================
  # 2. SonarQube Code Quality Server
  # =========================================================================
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-server
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "9000:9000"   # SonarQube Web UI & API
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar_secure_pass_123
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd-net

  # =========================================================================
  # 3. PostgreSQL Database (Database luu tru du lieu cho SonarQube)
  # =========================================================================
  db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar_secure_pass_123
      - POSTGRES_DB=sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - cicd-net
