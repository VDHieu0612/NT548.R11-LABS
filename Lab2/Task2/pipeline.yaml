AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lab 2 - CI/CD for CloudFormation (personal AWS account). Creates a CodeCommit repository,
  a CodeBuild project (cfn-lint + taskcat), a CodePipeline (Source -> Build -> Deploy 3 stacks),
  the IAM roles they need, and an EventBridge rule that starts the pipeline on every push.

Parameters:
  RepositoryName:
    Type: String
    Default: lab2-cfn
    Description: Name of the CodeCommit repository
  BranchName:
    Type: String
    Default: main
    Description: Branch that triggers the pipeline
  PipelineName:
    Type: String
    Default: lab2-cfn-pipeline
    Description: Name of the CodePipeline
  NetworkStackName:
    Type: String
    Default: lab2-vpc
    Description: Stack deployed from 01-vpc-network.yaml
  SecurityStackName:
    Type: String
    Default: lab2-sg
    Description: Stack deployed from 02-security-groups.yaml
  Ec2StackName:
    Type: String
    Default: lab2-ec2
    Description: Stack deployed from 03-ec2-instances.yaml
  ProjectName:
    Type: String
    Default: lab2-project
    Description: Name prefix for resources created by 01-vpc-network.yaml
  MyIp:
    Type: String
    Description: Your public IP in CIDR form, for example 203.0.113.10/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR, for example 203.0.113.10/32
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: lab2-key
    Description: Existing EC2 key pair in this region
  InstanceType:
    Type: String
    Default: t3.micro
    Description: x86_64 instance type for both EC2 instances

Resources:
  # ---------------------------------------------------------------------------
  # Source: CodeCommit repository
  # ---------------------------------------------------------------------------
  Repository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      RepositoryDescription: CloudFormation templates for Lab 2

  # ---------------------------------------------------------------------------
  # Artifact bucket used by CodePipeline to pass files between stages
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ---------------------------------------------------------------------------
  # IAM roles (lab scope: PowerUserAccess is broad, tighten it for real projects)
  # ---------------------------------------------------------------------------
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by CodePipeline to deploy the three stacks
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by CodeBuild to run cfn-lint and taskcat (taskcat deploys test stacks)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Service role of the CodePipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:GetRepository
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                  - codecommit:CancelUploadArchive
                Resource: !GetAtt Repository.Arn
              - Sid: RunBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt BuildProject.Arn
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEqualsIfExists:
                    iam:PassedToService: cloudformation.amazonaws.com

  # ---------------------------------------------------------------------------
  # Build: CodeBuild project (runs buildspec.yml: cfn-lint, then taskcat)
  # ---------------------------------------------------------------------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${PipelineName}-build"
      Description: Runs cfn-lint and taskcat against the CloudFormation templates
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 40
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0

  # ---------------------------------------------------------------------------
  # Pipeline: Source -> Build -> Deploy (01, then 02, then 03)
  # ---------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref PipelineName
      PipelineType: V1
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: CodeCommitSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              Configuration:
                RepositoryName: !GetAtt Repository.Name
                BranchName: !Ref BranchName
                PollForSourceChanges: "false"
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: LintAndTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

        - Name: Deploy
          Actions:
            - Name: DeployNetwork
              RunOrder: 1
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref NetworkStackName
                TemplatePath: "BuildOutput::cloudformation/01-vpc-network.yaml"
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub '{"ProjectName":"${ProjectName}"}'
              InputArtifacts:
                - Name: BuildOutput

            - Name: DeploySecurityGroups
              RunOrder: 2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref SecurityStackName
                TemplatePath: "BuildOutput::cloudformation/02-security-groups.yaml"
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub '{"NetworkStackName":"${NetworkStackName}","MyIp":"${MyIp}"}'
              InputArtifacts:
                - Name: BuildOutput

            - Name: DeployEc2
              RunOrder: 3
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref Ec2StackName
                TemplatePath: "BuildOutput::cloudformation/03-ec2-instances.yaml"
                RoleArn: !GetAtt CloudFormationRole.Arn
                ParameterOverrides: !Sub >-
                  {"NetworkStackName":"${NetworkStackName}",
                  "SecurityStackName":"${SecurityStackName}",
                  "KeyName":"${KeyName}",
                  "InstanceType":"${InstanceType}"}
              InputArtifacts:
                - Name: BuildOutput

  # ---------------------------------------------------------------------------
  # Trigger: EventBridge starts the pipeline when the branch is updated
  # ---------------------------------------------------------------------------
  TriggerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets EventBridge start the pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  TriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start the pipeline on every push to the watched branch
      State: ENABLED
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt Repository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref BranchName
      Targets:
        - Id: StartPipeline
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt TriggerRole.Arn

Outputs:
  RepositoryName:
    Description: Name of the CodeCommit repository
    Value: !GetAtt Repository.Name

  RepositoryCloneUrlHttp:
    Description: HTTPS clone URL of the repository
    Value: !GetAtt Repository.CloneUrlHttp

  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref Pipeline

  PipelineConsoleUrl:
    Description: Open the pipeline in the AWS console
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"

  ArtifactBucketName:
    Description: Artifact bucket (must be emptied before deleting this stack)
    Value: !Ref ArtifactBucket